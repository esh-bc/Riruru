# ╔══════════════════════════════════════════════════════╗
# ║   🌸 Riruru Bot — render.yaml                       ║
# ║   Render deployment config                           ║
# ╚══════════════════════════════════════════════════════╝

services:
  - type: web
    name: riruru-bot
    runtime: python
    plan: free

    # Build
    buildCommand: pip install -r requirements.txt

    # Start — runs bot + webserver together
    startCommand: python riruru_final.py

    # Render auto-sets PORT — webserver.py reads it
    envVars:
      - key: BOT_TOKEN
        sync: false          # set manually in Render dashboard

      # Optional overrides — already hardcoded in bot
      # Uncomment to override via Render env vars instead
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: TURSO_DATABASE_URL
      #   sync: false
      # - key: TURSO_AUTH_TOKEN
      #   sync: false

    # Health check — UptimeRobot also pings this
    healthCheckPath: /ping
