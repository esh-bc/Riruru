# ╔══════════════════════════════════════════════════════╗
# ║   🌸 Riruru Bot — render.yaml                       ║
# ║   Render deployment config                           ║
# ╚══════════════════════════════════════════════════════╝

services:
  - type: web
    name: riruru-bot
    runtime: python
    plan: free

    # Build
    buildCommand: pip install -r requirements.txt

    # Start — runs bot + webserver together
    startCommand: python riruru.py

    # Render auto-sets PORT — webserver.py reads it
    envVars:
      - key: BOT_TOKEN
        sync: false          # set manually in Render dashboard
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY2
        sync: false
      - key: GROQ_API_KEY3
        sync: false
      - key: GROQ_API_KEY4
        sync: false
      - key: GROQ_API_KEY5
        sync: false
      - key: OWNER_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

    # Health check — UptimeRobot also pings this
    healthCheckPath: /ping
